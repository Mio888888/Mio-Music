name: Desktop checks
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          gcc g++ clang cmake pkg-config libfontconfig-dev libwayland-dev
          libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev
          libssl-dev libzstd-dev libasound2-dev libvulkan1
      - name: Build dav1d from source
        if: runner.os == 'Linux'
        run: tools/ci/install-dav1d-linux.sh
      # `dav1d-sys` (AVIF/MP4 decoding in gpui) links the system dav1d through pkg-config.
      - name: macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install dav1d pkgconf
      - name: Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A native command's failure does not stop a pwsh step, and the Chocolatey feed
          # answers 503 now and then; retry, and fail here instead of at the later build.
          function Invoke-Retry([scriptblock]$Command) {
            foreach ($attempt in 1..4) {
              & $Command
              if ($LASTEXITCODE -eq 0) { return }
              Start-Sleep -Seconds (15 * $attempt)
            }
            throw "command failed after 4 attempts: $Command"
          }
          Invoke-Retry { choco install pkgconfiglite -y --no-progress }
          Invoke-Retry { vcpkg install dav1d:x64-windows }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # The Flutter app's version follows Cargo.toml; the release workflow needs them to agree.
      - if: runner.os == 'Linux'
        run: python3 -I tools/ci/version.py --check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --locked
