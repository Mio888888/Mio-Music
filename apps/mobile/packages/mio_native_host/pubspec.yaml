name: mio_native_host
description: Mio Android and HarmonyOS host lifecycle shared by the UI and system media.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.vant.mio_music
        pluginClass: MioNativeHostPlugin
      ohos:
        pluginClass: MioNativeHostPlugin
