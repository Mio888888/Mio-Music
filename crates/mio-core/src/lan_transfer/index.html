<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mio Music</title>
<style>body{font:16px system-ui,sans-serif;background:#eef3f0;color:#233c30;max-width:680px;margin:40px auto;padding:0 20px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}label{display:block;margin:16px 0 6px}input,button,select{box-sizing:border-box;font:inherit;padding:12px;border:1px solid #bccbc2;border-radius:8px}input{max-width:100%;width:100%}button{background:#315b48;color:white;cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;margin-top:12px;line-height:1.6}</style>
<label for="language">Language / 语言</label><select id="language"><option value="en-US">English</option><option value="zh-CN">简体中文</option></select>
<h1>Mio Music · <span data-i18n="title">LAN transfer</span></h1><p data-i18n="webIntro"></p>
<section id="pairing"><h2 data-i18n="connectTitle"></h2><label for="code" data-i18n="codeLabel"></label><input id="code" autocomplete="off" spellcheck="false" maxlength="64"><button id="pair" type="button" data-i18n="connect"></button><small data-i18n="pairHint"></small></section>
<section id="send" hidden><h2 data-i18n="sendTitle"></h2><label for="audio" data-i18n="audioLabel"></label><input id="audio" type="file" accept=".mp3,.flac,.wav,.ogg,.m4a,.aac,.wma,.opus,.ape,.alac"><button id="sendAudio" type="button" data-i18n="sendAudio"></button><label for="plugin" data-i18n="pluginLabel"></label><input id="plugin" type="file" accept=".js,.txt"><button id="sendPlugin" type="button" data-i18n="sendPlugin"></button><label for="url" data-i18n="pluginUrl"></label><input id="url" type="url" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="https://…"><button id="sendUrl" type="button" data-i18n="sendUrl"></button><small data-i18n="sendHint"></small></section>
<section><h2 data-i18n="results"></h2><div id="status" role="status" aria-live="polite"></div><small data-i18n="resultHint"></small></section>
<noscript>Enable JavaScript to connect. 请启用 JavaScript 以连接电视。</noscript>
<script src="/app.js" defer></script></html>
